<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Cyber Sentinels password</title>
  </head>
  <body style="margin:0;background:#04070c;color:#f4f4f5;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#04070c;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#09090b;border:1px solid #27272a;border-radius:16px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 24px;color:#a5f3fc;font-size:12px;font-weight:700;letter-spacing:2px">CYBER SENTINELS</p>
                <h1 style="margin:0 0 16px;color:#ffffff;font-size:28px;line-height:1.2">Reset your password</h1>
                <p style="margin:0 0 24px;color:#a1a1aa;font-size:16px;line-height:1.6">Use the secure link below to choose a new password. This link expires and can only be used once.</p>
                <p style="margin:0 0 24px">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:10px;background:#ffffff;color:#09090b;padding:14px 20px;text-decoration:none;font-weight:700">Set a new password</a>
                </p>
                <p style="margin:0;color:#71717a;font-size:13px;line-height:1.5">If you did not request this change, you can ignore this email. Cyber Sentinels will never ask you to share a reset link or security code.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
