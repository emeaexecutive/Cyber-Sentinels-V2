name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3.37.4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3.37.4
      - uses: github/codeql-action/analyze@v3.37.4
