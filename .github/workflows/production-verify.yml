name: Production verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cookie-consent
      - run: npm run test:observability
      - run: npm run test:security-tooling
      - run: npm run test:security-zap-config
      - run: npm run test:release-health
      - run: npm run security:zap:staging
      - run: npm test
      - run: npm run build
