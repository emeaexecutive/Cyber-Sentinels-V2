version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
      css-toolchain:
        patterns:
          - "postcss"
          - "autoprefixer"
          - "tailwindcss"
      supabase-tooling:
        dependency-type: "development"
        patterns:
          - "supabase"
      development-tooling:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "tsx"
          - "typescript"
          - "@types/node"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      codeql:
        patterns:
          - "github/codeql-action"
      security-scanners:
        patterns:
          - "gitleaks/gitleaks-action"
      workflow-runtime-actions:
        patterns:
          - "actions/checkout"
          - "actions/setup-node"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
